[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
Draggable=1
KeepOnScreen=1
SnapEdges=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=SR-23 | Chronometer
Author=Starbreaker
Information=Galactic Standard chronometer module.
Version=0.2.0

[Variables]
BG=7,10,16,245
Line=104,91,77,220
Text=231,229,224,255
Muted=153,151,147,255
Copper=190,125,69,255
Amber=235,163,78,255
Stardate=000.00.00
GST=00.00.00.00
UTC=--:--:--
EarthDate=----
Progress=0.00
Elapsed=0

[MeasureChronometer]
Measure=Script
ScriptFile=#@#Scripts\Chronometer.lua
UpdateDivider=1

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,390,230,16 | Fill Color #BG# | StrokeWidth 1 | Stroke Color #Line#

[MeterLabel]
Meter=String
X=22
Y=18
FontFace=Segoe UI
FontSize=10
StringStyle=Bold
FontColor=#Copper#
AntiAlias=1
Text=GALACTIC CHRONOMETER

[MeterStardate]
Meter=String
X=20
Y=43
FontFace=Segoe UI Semibold
FontSize=34
FontColor=#Amber#
AntiAlias=1
DynamicVariables=1
Text=#Stardate#

[MeterGSTLabel]
Meter=String
X=22
Y=99
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
Text=GALACTIC STANDARD TIME

[MeterGST]
Meter=String
X=22
Y=116
FontFace=Consolas
FontSize=20
FontColor=#Text#
AntiAlias=1
DynamicVariables=1
Text=#GST#

[MeterRule]
Meter=Shape
Shape=Rectangle 22,153,346,1 | Fill Color #Line# | StrokeWidth 0

[MeterUTC]
Meter=String
X=22
Y=166
FontFace=Segoe UI
FontSize=10
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
Text=EARTH UTC  #UTC#

[MeterDate]
Meter=String
X=368
Y=166
StringAlign=Right
FontFace=Segoe UI
FontSize=10
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
Text=#EarthDate#

[MeterProgressLabel]
Meter=String
X=22
Y=194
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=CYCLE PROGRESS

[MeterProgress]
Meter=String
X=368
Y=191
StringAlign=Right
FontFace=Consolas
FontSize=9
FontColor=#Amber#
AntiAlias=1
DynamicVariables=1
Text=#Progress#%
