[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
Draggable=1
KeepOnScreen=1
SnapEdges=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=SR-23 | Astra
Author=Starbreaker
Information=Independent Astra command-interface panel. Visual shell only; not connected to a live AI service.
Version=0.3.0

[Variables]
W=520
H=500
BG=7,10,16,245
Line=104,91,77,220
Text=231,229,224,255
Muted=153,151,147,255
Copper=190,125,69,255
Amber=235,163,78,255
Green=127,190,145,255

[MeasureClock]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%d %b %Y

[MeterPanel]
